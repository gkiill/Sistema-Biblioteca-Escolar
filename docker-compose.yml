services:
  frontend:
    image: nginx:alpine
    container_name: biblioteca_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Front:/usr/share/nginx/html:ro

  backend:
    build: ./Back
    container_name: biblioteca_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=BibliotecaEscolar
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=base64:LyimZua3D9E9f8RPl+4cKyqLQuThy/cZYtslvg/NEvs=
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=biblioteca
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - SESSION_DRIVER=database
    volumes:
      - ./Back:/var/www/html
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: biblioteca_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: biblioteca
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
